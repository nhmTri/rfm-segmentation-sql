<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="RFM matrix: recency by frequency, with segments named by rule.">
  <style>
    .k{font:500 10px ui-monospace,Menlo,monospace;fill:#8892A6;letter-spacing:.16em}
    .ax{font:500 10px ui-monospace,Menlo,monospace;fill:#8892A6}
    .lg{font:600 12px ui-monospace,Menlo,monospace;fill:#3C4354}
    .s{font:400 11px ui-monospace,Menlo,monospace;fill:#8892A6}
    .big{font:700 16px 'Segoe UI',Helvetica,sans-serif;fill:#2456D6}
    .cell{animation:pop .5s ease both;animation-delay:var(--d)}
    @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
    .champ{animation:pop .5s ease both,glow 2.6s ease-in-out infinite 1.6s;transform-box:fill-box;transform-origin:center}
    @keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 6px rgba(36,86,214,.55))}}
  </style>
  <text class="k" x="28" y="26">RFM MATRIX &#183; EVERY CUT-OFF A PARAMETER, NOT A HARD-CODED BOUNDARY</text>
  <text class="ax" x="108" y="176" text-anchor="end" transform="rotate(-90 108 170)">RECENCY &#8594;</text>
  <text class="ax" x="228" y="286" text-anchor="middle">FREQUENCY &#8594;</text>
    <rect class="cell" x="120" y="54" width="39" height="39" rx="6" fill="#1F7A5A" fill-opacity=".4" style="--d:0ms"/>
