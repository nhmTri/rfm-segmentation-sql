<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 376" width="1000" height="376" role="img" aria-label="A five by five recency and frequency grid colouring in cell by cell into five customer segments, beside the share of revenue each segment carries." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root{color-scheme:light dark}
    .ttl{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1B2030;letter-spacing:.08em}
    .tag{font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8892A6;letter-spacing:.18em}
    .ax{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8892A6}
    .lg{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1B2030}
    .pc{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace}
    .sub{font:400 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8892A6}
    .kw{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2456D6}
    .cd{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8892A6}
    .hl{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1F7A5A;letter-spacing:.14em}

    .cell{transform-box:fill-box;transform-origin:center;opacity:0;
          animation:pop .5s cubic-bezier(.34,1.3,.64,1) forwards, breathe 6s ease-in-out 2.6s infinite}
    @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:.88;transform:scale(1)}}
    @keyframes breathe{0%,100%{opacity:.88}50%{opacity:.70}}

    .gb{transform-box:fill-box;transform-origin:left;transform:scaleX(0);
        animation:grow .7s cubic-bezier(.2,.7,.3,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}

    .ring{fill:none;stroke:#1F7A5A;stroke-width:2.5;
          stroke-dasharray:420;stroke-dashoffset:420;
          animation:draw 1.1s ease-out 1.9s forwards, glow 3.4s ease-in-out 3.2s infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes glow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.3}}

    .fade{opacity:0;animation:fade .6s ease-out 2.6s forwards}
    @keyframes fade{to{opacity:1}}

    @media (prefers-reduced-motion:reduce){
      .cell{opacity:.88;animation:none}
      .gb{transform:scaleX(1);animation:none}
      .ring{stroke-dashoffset:0;animation:none}
      .fade{opacity:1;animation:none}
    }
    @media (prefers-color-scheme:dark){
      .ttl,.lg{fill:#E8ECF4} .ax,.sub,.tag{fill:#7F8AA0}
    }
  </style>

  <text class="tag" x="36" y="32">RECENCY  x  FREQUENCY   ·   EVERY CUT-OFF IS A PARAMETER</text>

  <rect class="cell" x="86" y="58" width="38" height="38" rx="5" fill="#C0392B" style="animation-delay:0.00s"/>
  <rect class="cell" x="130" y="58" width="38" height="38" rx="5" fill="#C0392B" style="animation-delay:0.07s"/>
  <rect class="cell" x="174" y="58" width="38" height="38" rx="5" fill="#2456D6" style="animation-delay:0.14s"/>
  <rect class="cell" x="218" y="58" width="38" height="38" rx="5" fill="#1F7A5A" style="animation-delay:0.21s"/>
  <rect class="cell" x="262" y="58" width="38" height="38" rx="5" fill="#1F7A5A" style="animation-delay:0.28s"/>
  <rect class="cell" x="86" y="102" width="38" height="38" rx="5" fill="#C0392B" style="animation-delay:0.07s"/>
  <rect class="cell" x="130" y="102" width="38" height="38" rx="5" fill="#C0392B" style="animation-delay:0.14s"/>
  <rect class="cell" x="174" y="102" width="38" height="38" rx="5" fill="#2456D6" style="animation-delay:0.21s"/>
