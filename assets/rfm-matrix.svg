  <rect class="cell" x="262" y="102" width="38" height="38" rx="5" fill="#1F7A5A" style="animation-delay:0.35s"/>
  <rect class="cell" x="86" y="146" width="38" height="38" rx="5" fill="#C0392B" style="animation-delay:0.14s"/>
  <rect class="cell" x="130" y="146" width="38" height="38" rx="5" fill="#C0392B" style="animation-delay:0.21s"/>
  <rect class="cell" x="174" y="146" width="38" height="38" rx="5" fill="#C2703A" style="animation-delay:0.28s"/>
  <rect class="cell" x="218" y="146" width="38" height="38" rx="5" fill="#2456D6" style="animation-delay:0.35s"/>
  <rect class="cell" x="262" y="146" width="38" height="38" rx="5" fill="#2456D6" style="animation-delay:0.42s"/>
  <rect class="cell" x="86" y="190" width="38" height="38" rx="5" fill="#C2703A" style="animation-delay:0.21s"/>
  <rect class="cell" x="130" y="190" width="38" height="38" rx="5" fill="#C2703A" style="animation-delay:0.28s"/>
  <rect class="cell" x="174" y="190" width="38" height="38" rx="5" fill="#C2703A" style="animation-delay:0.35s"/>
  <rect class="cell" x="218" y="190" width="38" height="38" rx="5" fill="#6B8FD6" style="animation-delay:0.42s"/>
  <rect class="cell" x="262" y="190" width="38" height="38" rx="5" fill="#6B8FD6" style="animation-delay:0.49s"/>
  <rect class="cell" x="86" y="234" width="38" height="38" rx="5" fill="#C2703A" style="animation-delay:0.28s"/>
  <rect class="cell" x="130" y="234" width="38" height="38" rx="5" fill="#C2703A" style="animation-delay:0.35s"/>
  <rect class="cell" x="174" y="234" width="38" height="38" rx="5" fill="#6B8FD6" style="animation-delay:0.42s"/>
  <rect class="cell" x="218" y="234" width="38" height="38" rx="5" fill="#6B8FD6" style="animation-delay:0.49s"/>
  <rect class="cell" x="262" y="234" width="38" height="38" rx="5" fill="#6B8FD6" style="animation-delay:0.56s"/>

  <text class="ax" x="74" y="82" text-anchor="end">5</text>
  <text class="ax" x="74" y="126" text-anchor="end">4</text>
  <text class="ax" x="74" y="170" text-anchor="end">3</text>
  <text class="ax" x="74" y="214" text-anchor="end">2</text>
  <text class="ax" x="74" y="258" text-anchor="end">1</text>
  <text class="ax" x="105" y="288" text-anchor="middle">1</text>
  <text class="ax" x="149" y="288" text-anchor="middle">2</text>
  <text class="ax" x="193" y="288" text-anchor="middle">3</text>
  <text class="ax" x="237" y="288" text-anchor="middle">4</text>
  <text class="ax" x="281" y="288" text-anchor="middle">5</text>
  <text class="ax" x="34" y="168" transform="rotate(-90 34 168)" text-anchor="middle">FREQUENCY</text>
  <text class="ax" x="193" y="308" text-anchor="middle">RECENCY</text>

  <rect class="ring" x="213" y="53" width="92" height="92" rx="7"/>
  <text class="hl fade" x="213" y="44">CHAMPIONS</text>

  <text class="tag" x="430" y="44">SHARE OF REVENUE</text>
  <text class="lg" x="430" y="66">Loyal</text>
  <rect x="430" y="72" width="200" height="7" rx="3.5" fill="#2456D6" opacity=".13"/>
  <rect class="gb" x="430" y="72" width="194" height="7" rx="3.5" fill="#2456D6" style="animation-delay:0.90s"/>
  <text class="pc" x="638" y="79" fill="#2456D6">44.2%</text>
  <text class="lg" x="430" y="102">Champions</text>
  <rect x="430" y="108" width="200" height="7" rx="3.5" fill="#1F7A5A" opacity=".13"/>
  <rect class="gb" x="430" y="108" width="174" height="7" rx="3.5" fill="#1F7A5A" style="animation-delay:1.02s"/>
  <text class="pc" x="638" y="115" fill="#1F7A5A">39.5%</text>
  <text class="lg" x="430" y="138">At risk</text>
  <rect x="430" y="144" width="200" height="7" rx="3.5" fill="#C0392B" opacity=".13"/>
  <rect class="gb" x="430" y="144" width="36" height="7" rx="3.5" fill="#C0392B" style="animation-delay:1.14s"/>
  <text class="pc" x="638" y="151" fill="#C0392B">8.1%</text>
  <text class="lg" x="430" y="174">Potential</text>
  <rect x="430" y="180" width="200" height="7" rx="3.5" fill="#6B8FD6" opacity=".13"/>
  <rect class="gb" x="430" y="180" width="26" height="7" rx="3.5" fill="#6B8FD6" style="animation-delay:1.26s"/>
  <text class="pc" x="638" y="187" fill="#6B8FD6">5.9%</text>
  <text class="lg" x="430" y="210">Need attention</text>
  <rect x="430" y="216" width="200" height="7" rx="3.5" fill="#C2703A" opacity=".13"/>
  <rect class="gb" x="430" y="216" width="10" height="7" rx="3.5" fill="#C2703A" style="animation-delay:1.38s"/>
  <text class="pc" x="638" y="223" fill="#C2703A">2.3%</text>


  <rect x="430" y="258" width="2" height="60" fill="#2456D6" opacity=".35"/>
  <text class="tag" x="444" y="250">THE WHOLE SCORING STEP · NO HARD-CODED BUCKETS</text>
  <text class="cd" x="444" y="274"><tspan class="kw">ntile</tspan>(5) over (order by last_order_at)  r</text>
  <text class="cd" x="444" y="292"><tspan class="kw">ntile</tspan>(5) over (order by orders)         f</text>
  <text class="cd" x="444" y="310"><tspan class="kw">ntile</tspan>(5) over (order by revenue)        m</text>

  <text class="ttl" x="36" y="334">CHAMPIONS SPEND 39% MORE AT THE SAME PURCHASE FREQUENCY</text>
  <text class="sub" x="36" y="354">That is the finding the split exists to surface — the top two bands carry 83% of revenue between them.</text>
</svg>
